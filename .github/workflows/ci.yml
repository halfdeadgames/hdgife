name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer run of the same ref replaces the one still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The published library: build and test it on the oldest and the newest JDK we support, and check it publishes.
  # The android and web modules are left out, they are only test harnesses.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PskipAndroid -PskipWeb :core:check :ktx:check :core:publishToMavenLocal :ktx:publishToMavenLocal

  # The desktop harness has to compile. The window test (uiTest) needs a display, so it is not run here.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PskipAndroid -PskipWeb :harness:compileKotlin :lwjgl3:compileKotlin

  # Optional: a failure here does not fail the run.
  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PskipWeb :android:assembleDebug

  # Optional: a failure here does not fail the run.
  web:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PskipAndroid :teavm:gdx_teavm_web_js_release_build
