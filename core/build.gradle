eclipse.project.name = appName + '-core'

// Only what the library really uses. Keep it this small.
dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  // Blade Ink is pinned to exactly this version: HdgifeStory overrides a package-private method and InkNativePatch uses
  // package-private internals, which can change in any other release. `strictly` is written to the Gradle module
  // metadata (so a consumer that asks for another version fails to resolve) and to the pom as an exact `[version]` range.
  // UpstreamCanaryTest checks the internals by reflection, so a version bump shows up as a failing test.
  api("com.bladecoder.ink:blade-ink") { version { strictly bladeInkVersion } }
  // Not in any public signature, so consumers get it at runtime only.
  implementation("com.bladecoder.ink:blade-ink-compiler") { version { strictly bladeInkVersion } }
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

  // Tests only. Not part of the published pom.
  testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:$kotlinVersion"
  // Pins the JUnit platform launcher (and Jupiter) to one consistent 5.x line, newer than the one kotlin-test-junit5 asks for.
  testImplementation platform("org.junit:junit-bom:5.14.4")
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Binary compatibility: Kotlin's built-in ABI validation keeps the public API of core in core/api/core.api, which is
// committed. `./gradlew :core:check` (and so `build`) runs checkKotlinAbi and fails when the code no longer matches the
// dump. After an intended API change, rewrite the dump and commit it with the change:
//   ./gradlew :core:updateKotlinAbi    writes core/api/core.api
//   ./gradlew :core:checkKotlinAbi     compares the code with the dump (also part of :core:check)
// jitpack.yml runs :core:test and :core:publishToMavenLocal only, which do not run checkKotlinAbi, so a stale dump
// never fails a JitPack build.
//
// Every public declaration says so (`public`) and names its type, so nothing becomes API by accident.
// The experimental marker is opted into for this module's own code and tests; consumers choose for themselves.
kotlin {
  explicitApi()
  abiValidation {
    enabled = true
  }
  compilerOptions {
    optIn.add('com.github.halfdeadgames.hdgife.ExperimentalHdgifeApi')
  }
}

test {
  useJUnitPlatform()
  systemProperty 'hdgife.projectVersion', project.version.toString()
  systemProperty 'hdgife.bladeInkVersion', bladeInkVersion
}

// Hdgife.VERSION comes from projectVersion in gradle.properties, the single source of truth.
def generatedVersionDir = layout.buildDirectory.dir('generated/hdgife/kotlin')
def generateVersion = tasks.register('generateVersion') {
  def outDir = generatedVersionDir
  def versionText = project.version.toString()
  inputs.property('version', versionText)
  outputs.dir(outDir)
  doLast {
    def dir = outDir.get().asFile.toPath().resolve('com/github/halfdeadgames/hdgife')
    java.nio.file.Files.createDirectories(dir)
    dir.resolve('Hdgife.kt').toFile().text = """package com.github.halfdeadgames.hdgife

/** Library version. Generated from projectVersion in gradle.properties. */
public object Hdgife {
    public const val VERSION: String = "${versionText}"
}
"""
  }
}
sourceSets.main.kotlin.srcDir(generateVersion)

// HdgifeInk (the library version and the reserved function names) is read from the two bundled ink files, so the
// Kotlin side can never drift from them: the version is `CONST hdgife_version` in hdgife.ink, the reserved names are
// every `=== function` (two or more `=`) and `EXTERNAL` of hdgife.ink and hdgife_util.ink.
// If you add, remove or change a function there, bump `CONST hdgife_version` in hdgife.ink and update the pinned
// hash in LibraryPinTest: that test fails with "library changed: bump hdgife_version" until you do.
def generatedInkDir = layout.buildDirectory.dir('generated/hdgifeInk/kotlin')
def generateInkLibrary = tasks.register('generateInkLibrary') {
  def coreFile = file('src/main/resources/hdgife/hdgife.ink')
  def utilFile = file('src/main/resources/hdgife/hdgife_util.ink')
  def outDir = generatedInkDir
  inputs.files(coreFile, utilFile)
  outputs.dir(outDir)
  doLast {
    def functionNames = { File f ->
      def found = new LinkedHashSet<String>()
      f.eachLine('UTF-8') { line ->
        def m = (line =~ /^(?:={2,}\s*function|EXTERNAL)\s+(\w+)/)
        if (m.find()) found << m.group(1)
      }
      found
    }
    def version = null
    coreFile.eachLine('UTF-8') { line ->
      def m = (line =~ /^CONST\s+hdgife_version\s*=\s*(\d+)/)
      if (m.find()) version = m.group(1)
    }
    if (version == null) throw new GradleException('hdgife.ink has no "CONST hdgife_version = N"')
    def core = functionNames(coreFile)
    def util = functionNames(utilFile)
    def overlap = core.intersect(util)
    if (!overlap.isEmpty()) throw new GradleException("hdgife.ink and hdgife_util.ink both declare: ${overlap}")
    def list = { Collection<String> names -> names.collect { '"' + it + '"' }.join(', ') }
    def dir = outDir.get().asFile.toPath().resolve('com/github/halfdeadgames/hdgife')
    java.nio.file.Files.createDirectories(dir)
    dir.resolve('HdgifeInk.kt').toFile().text = """package com.github.halfdeadgames.hdgife

/** Facts about the bundled ink libraries. Generated from hdgife.ink and hdgife_util.ink, do not edit. */
public object HdgifeInk {
    /**
     * The version of hdgife.ink this engine expects (`CONST hdgife_version`). A story that includes another version,
     * or an old one with no version (counted as 0), is refused with an IncompatibleLibraryException.
     */
    public const val VERSION: Int = ${version}

    /** The functions of hdgife.ink. */
    internal val CORE_FUNCTIONS: List<String> = listOf(${list(core)})

    /** The functions of hdgife_util.ink. */
    internal val UTIL_FUNCTIONS: List<String> = listOf(${list(util)})

    /**
     * Every function name the libraries reserve, from hdgife.ink and hdgife_util.ink (the names are not prefixed, so a
     * story must not define its own with these names). validateStory warns about one defined without its library.
     */
    public val LIBRARY_FUNCTIONS: List<String> = CORE_FUNCTIONS + UTIL_FUNCTIONS
}
"""
  }
}
sourceSets.main.kotlin.srcDir(generateInkLibrary)

apply plugin: 'maven-publish'

java {
  withSourcesJar()
  withJavadocJar()
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
      artifactId = 'hdgife'
      // Gradle writes `strictly` only to the module metadata. A plain pom version is a soft preference to Maven, so
      // write the Blade Ink dependencies as an exact range, [1.3.2], which Maven honors as a hard requirement.
      pom {
        name = 'hdgife'
        description = 'HDG Interactive Fiction Engine: Blade Ink narrative engine for Kotlin and libGDX games'
        url = 'https://github.com/halfdeadgames/hdgife'
        licenses {
          license {
            name = 'Apache License, Version 2.0'
            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            distribution = 'repo'
          }
        }
        developers {
          developer {
            id = 'halfdeadgames'
            name = 'halfdeadgames'
          }
        }
        scm {
          url = 'https://github.com/halfdeadgames/hdgife'
          connection = 'scm:git:git://github.com/halfdeadgames/hdgife.git'
          developerConnection = 'scm:git:ssh://git@github.com/halfdeadgames/hdgife.git'
        }
      }
      pom.withXml {
        asNode().dependencies.dependency.findAll { it.groupId.text() == 'com.bladecoder.ink' }.each {
          it.version[0].value = "[${bladeInkVersion}]"
        }
      }
    }
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  from(rootProject.layout.projectDirectory.file('LICENSE')) { into 'META-INF' }
  from(rootProject.layout.projectDirectory.file('NOTICE')) { into 'META-INF' }
}
