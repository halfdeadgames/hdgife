[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.bladecoder.ink:blade-ink:$bladeInkVersion"
  api "com.github.tommyettinger:sjInGameConsole:$inGameConsoleVersion"
  api "io.github.quillraven.fleks:Fleks:$fleksVersion"
  api "io.github.quillraven.libktx:ktx-app:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-assets-async:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-assets:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-async:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-collections:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-freetype-async:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-freetype:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-graphics:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-i18n:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-json:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-log:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-preferences:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-scene2d:$ktxVersion"
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
  api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinxCoroutinesVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

apply plugin: 'maven-publish'

java {
  withSourcesJar()
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
      artifactId = 'hdgife'
    }
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
